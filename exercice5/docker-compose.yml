# Exercice 5 — Architecture cible (proposition, non déployée dans le labo)
#  - 3 applications : shop (principale, 2 instances), blog, admin (privée, BasicAuth)
#  - HTTPS partout via Let's Encrypt (ACME), redirection HTTP -> HTTPS
#  - health checks sur le service principal
#  - dashboard NON public : entrypoint dédié lié à l'IP VPN + allowlist + auth
#  - Traefik ne monte PAS docker.sock : il passe par un proxy de socket filtré
#  - réseaux séparés par niveau de confiance

x-app: &app
  read_only: true
  tmpfs: [/var/cache/nginx, /var/run, /tmp]
  cap_drop: [ALL]
  cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.3.0
    environment:
      CONTAINERS: 1          # lecture des conteneurs uniquement
      NETWORKS: 1
      EVENTS: 1
      POST: 0                # aucune opération d'écriture (create/exec/kill...)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]        # réseau interne, jamais publié
    restart: unless-stopped

  traefik:
    image: traefik:v3.6.2
    ports:
      - "80:80"
      - "443:443"
      - "10.8.0.1:8443:8443"   # entrypoint admin, uniquement sur l'interface VPN
    volumes:
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./secrets/admin.htpasswd:/secrets/admin.htpasswd:ro   # hors Git, chmod 600
      - acme:/acme                                            # acme.json (clés privées)
    security_opt: [no-new-privileges:true]
    networks: [edge, socket, front-public, front-private]   # edge : ports publiés + sortie ACME
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.devtech.internal`)"
      - "traefik.http.routers.dashboard.entrypoints=admin"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=vpn-only@file,admin-auth@file"
    restart: unless-stopped

  shop-a: &shop
    <<: *app
    image: nginx:1.28.0
    volumes: ["./shop:/usr/share/nginx/html:ro"]
    networks: [front-public]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shop.rule=Host(`shop.devtech.example`)"
      - "traefik.http.routers.shop.entrypoints=websecure"
      - "traefik.http.routers.shop.tls.certresolver=le"
      - "traefik.http.routers.shop.middlewares=security-headers@file,rate-limit@file"
      - "traefik.http.services.shop.loadbalancer.server.port=80"
      - "traefik.http.services.shop.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.shop.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.shop.loadbalancer.healthcheck.timeout=2s"
  shop-b:
    <<: *shop

  blog:
    <<: *app
    image: nginx:1.28.0
    volumes: ["./blog:/usr/share/nginx/html:ro"]
    networks: [front-public]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blog.rule=Host(`blog.devtech.example`)"
      - "traefik.http.routers.blog.entrypoints=websecure"
      - "traefik.http.routers.blog.tls.certresolver=le"
      - "traefik.http.routers.blog.middlewares=security-headers@file"
      - "traefik.http.services.blog.loadbalancer.server.port=80"

  admin:
    <<: *app
    image: nginx:1.28.0
    volumes: ["./admin:/usr/share/nginx/html:ro"]
    networks: [front-private]   # isolée de shop/blog
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.devtech.example`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls.certresolver=le"
      # le mot de passe n'est PAS dans les labels : référence à un middleware fichier
      - "traefik.http.routers.admin.middlewares=admin-auth@file,security-headers@file"
      - "traefik.http.services.admin.loadbalancer.server.port=80"

networks:
  edge: {}
  socket:
    internal: true
  front-public:
    internal: true    # pas d'accès sortant pour les applis
  front-private:
    internal: true

volumes:
  acme:
